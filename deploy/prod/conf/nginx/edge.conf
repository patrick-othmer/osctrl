# osctrl-edge — production nginx config for the osquery endpoint.
#
# Dedicated entrypoint for agent traffic. Terminates TLS and proxies to
# osctrl-tls:9000 over the compose network. Certificates are mounted at
# runtime (./secrets/osctrl.{crt,key}) — they are never baked into the
# image.
#
# The upstream is resolved per request through Docker's embedded DNS
# (127.0.0.11) instead of nginx's one-time startup lookup: recreating
# osctrl-tls assigns it a new container IP, and a startup-resolved
# upstream would pin the old address and 502 until the next nginx reload.
#
# Everything on this server is proxied to osctrl-tls on purpose: the host
# only exists for osquery/osctrld traffic, and the Go service is the
# authority on which URIs exist (enroll-secret auth, rate limits, audit
# logging all live there). Proxying the full URI space means new osctrl
# endpoints never require an nginx config change.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    server_tokens off;

    ssl_certificate /etc/ssl/osctrl/tls.crt;
    ssl_certificate_key /etc/ssl/osctrl/tls.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 5m;
    ssl_session_tickets off;

    # Hard-pin agent hosts to HTTPS.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Log batches, query results, and carve blocks can be large.
    client_max_body_size 64m;

    # Orchestrator / load-balancer probe.
    location = /health {
        access_log off;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 200 "ok\n";
    }

    location / {
        # Variable proxy_pass forces per-request DNS resolution (see
        # the resolver directive above); the request URI is passed
        # through unchanged.
        set $osctrl_tls http://osctrl-tls:9000;
        proxy_pass $osctrl_tls;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Carve blocks stream in 64k chunks; buffering is pure overhead.
        proxy_buffering off;
    }
}
